<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimal to Binary Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="author-container">
                <div class="author">ikekwe prosper</div>
            </div>
            <h1>Decimal to Binary Converter</h1>
            <p class="subtitle">Convert decimal numbers to binary representation</p>
            
            <div class="input-group">
                <label for="decimalInput">Enter Decimal Number:</label>
                <input 
                    type="number" 
                    id="decimalInput" 
                    placeholder="e.g., 10, 3.5, 255.75"
                    step="0.01"
                >
                <button id="convertBtn">Convert</button>
            </div>

            <div class="results" id="results" style="display: none;">
                <div class="result-item">
                    <label>Decimal:</label>
                    <div class="result-value" id="decimalDisplay"></div>
                </div>
                
                <div class="result-item">
                    <label>Binary:</label>
                    <div class="result-value" id="binaryDisplay"></div>
                </div>

                <div class="result-item">
                    <label>Explanation:</label>
                    <div class="result-value explanation" id="explanation"></div>
                </div>
            </div>

            <div class="examples">
                <h3>Quick Examples:</h3>
                <div class="example-buttons">
                    <button class="example-btn" onclick="convertExample(10)">10</button>
                    <button class="example-btn" onclick="convertExample(255)">255</button>
                    <button class="example-btn" onclick="convertExample(3.5)">3.5</button>
                    <button class="example-btn" onclick="convertExample(15.75)">15.75</button>
                    <button class="example-btn" onclick="convertExample(0.625)">0.625</button>
                </div>
            </div>
        </div>
    </div>

    <script src="sript.js"></script>
</body>
</html>
